
name: Web UI Automation Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  web-tests:
    name: Run Web UI Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Web UI automation tests
        run: bash ./gradlew clean webTest --no-daemon

      - name: Upload Web UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-test-reports
          path: |
            build/reports/cucumber/web-report.html
            build/reports/cucumber/web-report.json
          if-no-files-found: warn
